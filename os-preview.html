<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula OS | Live Preview</title>
  <link rel="icon" type="image/png" href="assets/nebulaLogo.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.94/build/spline-viewer.js"></script>
  <style>
    :root { --accent: #00ffcc; --purple: #9d4edd; --glass: rgba(10, 14, 22, 0.62); --line: rgba(0, 255, 204, 0.22); }
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: #03040a; color: #fff; overflow: hidden; user-select: none; }

    /* ---------- Fondo (fallback siempre visible + escena Spline encima) ---------- */
    .wall { position: fixed; inset: 0; z-index: 0; background:
        radial-gradient(ellipse 60% 50% at 25% 30%, rgba(157, 78, 221, 0.28), transparent 60%),
        radial-gradient(ellipse 55% 45% at 78% 70%, rgba(0, 255, 204, 0.18), transparent 60%),
        radial-gradient(ellipse at center, #0a0d1a 0%, #03040a 75%); }
    .stars, .stars2 { position: absolute; inset: -50%; background-repeat: repeat; animation: drift 180s linear infinite; }
    .stars { background-image:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 120px 80px, #cfe, transparent),
        radial-gradient(1.5px 1.5px at 200px 150px, #fff, transparent), radial-gradient(1px 1px at 300px 40px, #bdf, transparent),
        radial-gradient(1px 1px at 380px 210px, #fff, transparent); background-size: 420px 260px; opacity: .55; }
    .stars2 { background-image: radial-gradient(2px 2px at 60px 120px, rgba(0,255,204,.9), transparent), radial-gradient(1.5px 1.5px at 260px 30px, rgba(157,78,221,.9), transparent);
      background-size: 520px 340px; opacity: .45; animation-duration: 260s; }
    @keyframes drift { to { transform: translate(-210px, -130px); } }
    .wall-logo { position: absolute; top: 50%; left: 50%; width: 360px; transform: translate(-50%, -58%); opacity: .07; filter: drop-shadow(0 0 40px var(--accent)); animation: spin 120s linear infinite; }
    @keyframes spin { to { transform: translate(-50%, -58%) rotate(360deg); } }
    spline-viewer { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; }

    /* ---------- Barra superior (como en el OS real) ---------- */
    .topbar { position: fixed; top: 12px; left: 16px; right: 16px; z-index: 40; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .pill { pointer-events: all; display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 14px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
    .pill img { width: 20px; filter: drop-shadow(0 0 6px var(--accent)); }
    .ws { display: flex; gap: 6px; align-items: center; }
    .ws span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.3); }
    .ws span.on { width: 18px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .chip { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--accent); font-weight: 600; font-size: 12px; }
    .clock { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 1px; color: #e6fffa; text-shadow: 0 0 10px rgba(0,255,204,.5); }
    .clock small { color: #94a3b8; font-weight: 400; margin-left: 8px; }
    .sys i { color: #cbd5e1; font-size: 13px; }
    .sys b { color: var(--accent); font-weight: 600; font-size: 12px; }

    .exit { position: fixed; top: 64px; left: 16px; z-index: 41; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: 600; background: var(--glass); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(12px); transition: .25s; }
    .exit:hover { color: #fff; border-color: #ff5f56; box-shadow: 0 0 18px rgba(255,95,86,.35); }

    /* ---------- Ventana terminal ---------- */
    .window { position: absolute; top: 50%; left: 50%; width: min(760px, 92vw); height: min(470px, 62vh); transform: translate(-50%, -54%); z-index: 30; display: flex; flex-direction: column; overflow: hidden;
      background: rgba(6, 9, 16, 0.82); border: 1px solid rgba(0,255,204,.35); border-radius: 16px; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.03) inset, 0 0 60px rgba(0,255,204,.12); transition: opacity .35s ease, scale .35s cubic-bezier(.2,.9,.3,1.2); }
    .window.hidden { opacity: 0; scale: .92; pointer-events: none; }
    .win-head { height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: linear-gradient(180deg, rgba(255,255,255,.04), transparent); border-bottom: 1px solid rgba(0,255,204,.12); }
    .win-title { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: #e2e8f0; }
    .win-title i { color: var(--accent); }
    .dots { display: flex; gap: 8px; }
    .dots span { width: 12px; height: 12px; border-radius: 50%; }
    .d-min { background: #ffbd2e; } .d-max { background: #27c93f; } .d-close { background: #ff5f56; }
    .term { flex: 1; overflow-y: auto; padding: 16px 18px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.6; color: #a7f3d0; user-select: text; }
    .term::-webkit-scrollbar { width: 6px; } .term::-webkit-scrollbar-thumb { background: rgba(0,255,204,.25); border-radius: 3px; }
    .line { white-space: pre-wrap; word-break: break-word; }
    .p-user { color: var(--purple); } .p-path { color: var(--accent); }
    .muted { color: #64748b; } .err { color: #ff6b6b; } .ok { color: #4ade80; } .white { color: #f1f5f9; } .acc { color: var(--accent); }
    .input-row { display: flex; align-items: center; gap: 8px; }
    .input-row input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font: inherit; caret-color: var(--accent); }
    .neo { display: flex; gap: 22px; align-items: flex-start; margin: 6px 0 10px; }
    .neo img { width: 110px; filter: drop-shadow(0 0 14px rgba(0,255,204,.6)); }
    .neo .swatch { display: inline-block; width: 18px; height: 12px; margin-right: 3px; border-radius: 2px; }

    /* ---------- Dock ---------- */
    .dock { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: flex-end; gap: 10px; padding: 9px 12px; background: var(--glass); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 15px 40px rgba(0,0,0,.6); }
    .app { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; position: relative; transition: transform .25s cubic-bezier(.2,.9,.3,1.4), box-shadow .25s; }
    .app:hover { transform: translateY(-8px) scale(1.15); box-shadow: 0 10px 25px rgba(0,0,0,.5); }
    .app::before { content: attr(data-name); position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%) translateY(6px); padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; white-space: nowrap; background: rgba(6,9,16,.92); border: 1px solid var(--line); opacity: 0; transition: .2s; pointer-events: none; }
    .app:hover::before { opacity: 1; transform: translateX(-50%) translateY(0); }
    .app.running::after { content: ''; position: absolute; bottom: -6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .sep { width: 1px; height: 30px; margin: 0 4px 7px; background: rgba(255,255,255,.12); }
    .a-nebula { background: radial-gradient(circle at 30% 30%, #1e293b, #020617); border: 1px solid var(--line); }
    .a-nebula img { width: 26px; filter: drop-shadow(0 0 6px var(--accent)); }
    .a-term { background: linear-gradient(135deg, #0f172a, #1e293b); border: 1px solid rgba(255,255,255,.12); color: var(--accent); }
    .a-files { background: linear-gradient(135deg, #38bdf8, #2563eb); }
    .a-code { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .a-music { background: linear-gradient(135deg, #22c55e, #15803d); }
    .a-game { background: linear-gradient(135deg, #a855f7, #6d28d9); }
    .a-store { background: linear-gradient(135deg, #fbbf24, #f97316); }
    .a-nova { background: radial-gradient(circle at 30% 30%, #312e81, #0b1020); border: 1px solid rgba(157,78,221,.5); }
    .a-nova img { width: 26px; filter: drop-shadow(0 0 6px #c4b5fd); }
    .a-set { background: linear-gradient(135deg, #64748b, #334155); }

    /* ---------- Notificacion ---------- */
    .toast { position: fixed; top: 64px; right: 16px; z-index: 50; width: 320px; display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgba(6,9,16,.9); border: 1px solid var(--line); backdrop-filter: blur(18px); box-shadow: 0 15px 40px rgba(0,0,0,.6); transform: translateX(120%); transition: transform .45s cubic-bezier(.2,.9,.3,1.1); }
    .toast.show { transform: none; }
    .toast img { width: 34px; height: 34px; }
    .toast b { display: block; font-size: 13px; margin-bottom: 3px; color: var(--accent); }
    .toast span { font-size: 12.5px; color: #cbd5e1; line-height: 1.45; }

    /* ---------- Cursor ---------- */
    .c-dot, .c-ring { position: fixed; top: 0; left: 0; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity .3s, width .2s, height .2s, background .2s; z-index: 9999; }
    .c-dot { width: 8px; height: 8px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .c-ring { width: 38px; height: 38px; border: 1px solid rgba(0,255,204,.6); }
    body.cur .c-dot, body.cur .c-ring { opacity: 1; }
    body.cur-hover .c-ring { width: 58px; height: 58px; background: rgba(0,255,204,.08); }

    @media (hover: none), (pointer: coarse) { * { cursor: auto !important; } .c-dot, .c-ring { display: none; } }
    @media (max-width: 700px) {
      .pill.left .chip, .pill.right .sys-extra { display: none; }
      .app { width: 38px; height: 38px; font-size: 17px; } .dock { gap: 6px; } .app.opt { display: none; }
      .window { height: 58vh; } .neo img { width: 70px; }
    }
  </style>
</head>
<body>
  <div class="wall"><div class="stars"></div><div class="stars2"></div><img class="wall-logo" src="assets/nebulaLogo.png" alt=""></div>
  <spline-viewer url="assets/scene.splinecode"></spline-viewer>

  <div class="topbar">
    <div class="pill left">
      <img src="assets/nebulaLogo.png" alt="">
      <div class="ws"><span class="on"></span><span></span><span></span><span></span></div>
      <span class="chip">&gt;_ Estudio</span>
    </div>
    <div class="pill"><span class="clock" id="clock">00:00:00</span></div>
    <div class="pill right sys">
      <span class="chip sys-extra"><i class="fa-solid fa-wave-square"></i> HUD</span>
      <i class="fa-solid fa-wifi"></i><i class="fa-solid fa-volume-high sys-extra"></i>
      <i class="fa-solid fa-battery-full"></i><b>100%</b>
    </div>
  </div>

  <a href="index.html" class="exit"><i class="fa-solid fa-arrow-left"></i> Salir del simulador</a>

  <div class="window" id="win">
    <div class="win-head" id="win-head">
      <div class="win-title"><i class="fa-solid fa-terminal"></i> Nebula Terminal &mdash; root@nebula-os</div>
      <div class="dots"><span class="d-min" data-act="min"></span><span class="d-max" data-act="max"></span><span class="d-close" data-act="close"></span></div>
    </div>
    <div class="term" id="term">
      <div id="out"></div>
      <div class="input-row"><span><span class="p-user">root@nebula</span>:<span class="p-path">~</span>$</span><input id="cmd" autocomplete="off" spellcheck="false" autofocus></div>
    </div>
  </div>

  <div class="dock">
    <div class="app a-nebula" data-name="Nebula"><img src="assets/nebulaLogo.png" alt=""></div>
    <div class="app a-term running" data-name="Terminal" data-app="term"><i class="fa-solid fa-terminal"></i></div>
    <div class="app a-files" data-name="Archivos"><i class="fa-solid fa-folder"></i></div>
    <div class="app a-code opt" data-name="C&oacute;digo"><i class="fa-solid fa-code"></i></div>
    <div class="app a-music opt" data-name="M&uacute;sica"><i class="fa-solid fa-music"></i></div>
    <div class="app a-game" data-name="Gaming Hub"><i class="fa-solid fa-gamepad"></i></div>
    <div class="app a-store" data-name="Nebula Store"><i class="fa-solid fa-bag-shopping"></i></div>
    <div class="sep"></div>
    <div class="app a-nova" data-name="Nova AI" data-app="nova"><img src="assets/novaLogo.png" alt=""></div>
    <div class="app a-set" data-name="Ajustes"><i class="fa-solid fa-gear"></i></div>
  </div>

  <div class="toast" id="toast"><img src="assets/novaLogo.png" alt=""><div><b id="toast-title">Nova AI</b><span id="toast-text"></span></div></div>

  <div class="c-dot" id="c-dot"></div><div class="c-ring" id="c-ring"></div>

  <script>
    (function () {
      // ----- Cursor -----
      var dot = document.getElementById('c-dot'), ring = document.getElementById('c-ring');
      window.addEventListener('mousemove', function (e) {
        document.body.classList.add('cur');
        dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px';
        ring.animate({ left: e.clientX + 'px', top: e.clientY + 'px' }, { duration: 450, fill: 'forwards' });
      });
      document.addEventListener('mouseover', function (e) {
        document.body.classList.toggle('cur-hover', !!(e.target.closest && e.target.closest('a, .app, .dots span, input')));
      });

      // ----- Reloj -----
      var DIAS = ['dom', 'lun', 'mar', 'mi\u00e9', 'jue', 'vie', 's\u00e1b'];
      var clock = document.getElementById('clock');
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function tickClock() {
        var d = new Date();
        clock.innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '<small>' + DIAS[d.getDay()] + ' ' + d.getDate() + '</small>';
      }
      tickClock(); setInterval(tickClock, 1000);

      // ----- Ventana: arrastrar, minimizar, maximizar, cerrar -----
      var win = document.getElementById('win'), head = document.getElementById('win-head');
      var drag = null;
      head.addEventListener('mousedown', function (e) {
        if (e.target.closest('.dots')) return;
        var r = win.getBoundingClientRect();
        win.style.transform = 'none'; win.style.left = r.left + 'px'; win.style.top = r.top + 'px';
        drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
      });
      window.addEventListener('mousemove', function (e) {
        if (!drag) return;
        win.style.left = (e.clientX - drag.dx) + 'px';
        win.style.top = Math.max(56, e.clientY - drag.dy) + 'px';
      });
      window.addEventListener('mouseup', function () { drag = null; });

      var termApp = document.querySelector('[data-app="term"]');
      var maxed = false;
      document.querySelectorAll('.dots span').forEach(function (b) {
        b.addEventListener('click', function () {
          var act = b.dataset.act;
          if (act === 'close' || act === 'min') { win.classList.add('hidden'); if (act === 'close') termApp.classList.remove('running'); }
          if (act === 'max') {
            maxed = !maxed;
            if (maxed) { win.style.transform = 'none'; win.style.left = '16px'; win.style.top = '62px'; win.style.width = 'calc(100vw - 32px)'; win.style.height = 'calc(100vh - 150px)'; }
            else { win.style.left = '50%'; win.style.top = '50%'; win.style.width = ''; win.style.height = ''; win.style.transform = 'translate(-50%, -54%)'; }
          }
        });
      });

      // ----- Notificaciones -----
      var toast = document.getElementById('toast'), toastTimer = null;
      function notify(title, text) {
        document.getElementById('toast-title').textContent = title;
        document.getElementById('toast-text').textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 3800);
      }

      document.querySelectorAll('.app').forEach(function (a) {
        a.addEventListener('click', function () {
          if (a.dataset.app === 'term') {
            win.classList.toggle('hidden'); termApp.classList.add('running');
            if (!win.classList.contains('hidden')) cmd.focus();
          } else if (a.dataset.app === 'nova') {
            notify('Nova AI', 'Hola, soy Nova. Prob\u00e1 escribir "nova" o "neofetch" en la terminal.');
          } else {
            notify(a.dataset.name, 'Disponible en la versi\u00f3n completa de Nebula OS. Este simulador muestra la terminal.');
          }
        });
      });

      // ----- Terminal -----
      var out = document.getElementById('out'), term = document.getElementById('term'), cmd = document.getElementById('cmd');
      var history = [], hIdx = 0;
      function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
      function print(html, cls) {
        var d = document.createElement('div');
        d.className = 'line' + (cls ? ' ' + cls : '');
        d.innerHTML = html;
        out.appendChild(d);
        term.scrollTop = term.scrollHeight;
      }
      function prompt(text) {
        print('<span class="p-user">root@nebula</span>:<span class="p-path">~</span>$ <span class="white">' + esc(text) + '</span>');
      }
      function typeLines(lines, i) {
        i = i || 0;
        if (i >= lines.length) return;
        print(lines[i][0], lines[i][1]);
        setTimeout(function () { typeLines(lines, i + 1); }, 70);
      }

      function neofetch() {
        var sw = ['#00ffcc', '#9d4edd', '#ff2e97', '#38bdf8', '#fbbf24', '#4ade80'].map(function (c) {
          return '<span class="swatch" style="background:' + c + '"></span>';
        }).join('');
        print('<div class="neo"><img src="assets/nebulaLogo.png" alt=""><div>' +
          '<span class="acc"><b>root</b></span>@<span class="acc"><b>nebula-os</b></span><br>' +
          '<span class="muted">-----------------</span><br>' +
          '<span class="acc">OS</span>: Nebula OS 2.5 Ultimate x86_64<br>' +
          '<span class="acc">Kernel</span>: 6.8-nebula-custom<br>' +
          '<span class="acc">Shell</span>: nsh 2.5<br>' +
          '<span class="acc">DE</span>: Nebula Desktop (Glass)<br>' +
          '<span class="acc">Tema</span>: Cyberpunk Ne\u00f3n<br>' +
          '<span class="acc">Seguridad</span>: Nebula Shield [ACTIVO]<br>' +
          '<span class="acc">IA</span>: Nova AI Core<br>' +
          '<span class="acc">Telemetr\u00eda</span>: <span class="ok">0 procesos</span><br><br>' + sw +
          '</div></div>');
      }

      var COMMANDS = {
        help: function () {
          typeLines([
            ['Comandos disponibles:', 'acc'],
            ['  <span class="white">neofetch</span>   informaci\u00f3n del sistema', ''],
            ['  <span class="white">ls</span>         listar archivos', ''],
            ['  <span class="white">whoami</span>     usuario actual', ''],
            ['  <span class="white">date</span>       fecha y hora', ''],
            ['  <span class="white">shield</span>     estado de Nebula Shield', ''],
            ['  <span class="white">nova</span>       hablar con Nova AI', ''],
            ['  <span class="white">gamemode</span>   activar Modo Juego', ''],
            ['  <span class="white">clear</span>      limpiar la terminal', ''],
            ['  <span class="white">startx</span>     abrir la exposici\u00f3n 3D', ''],
            ['  <span class="white">exit</span>       volver al inicio', '']
          ]);
        },
        neofetch: neofetch,
        ls: function () { print('<span class="acc">Documentos/</span>  <span class="acc">Descargas/</span>  <span class="acc">Juegos/</span>  <span class="acc">Proyectos/</span>  <span class="white">nebula-shield.log</span>  <span class="white">notas.md</span>'); },
        whoami: function () { print('root <span class="muted">(administrador del sistema)</span>'); },
        date: function () { print(new Date().toString()); },
        shield: function () {
          typeLines([
            ['[ <span class="ok">OK</span> ] Firewall de aplicaciones .......... activo', ''],
            ['[ <span class="ok">OK</span> ] Sandbox de procesos ............... activo', ''],
            ['[ <span class="ok">OK</span> ] Bloqueo de telemetr\u00eda ............ activo', ''],
            ['[ <span class="ok">OK</span> ] Gestor de contrase\u00f1as ............ cifrado AES-256', ''],
            ['Nebula Shield: <span class="ok">sistema protegido</span>', 'acc']
          ]);
        },
        nova: function () {
          print('<span class="acc">Nova AI</span> &gt; Hola, soy Nova. Estoy integrada al kernel para optimizar recursos y responder tus dudas.');
          notify('Nova AI', 'Conexi\u00f3n con el n\u00facleo establecida. Todo funciona perfecto.');
        },
        gamemode: function () {
          typeLines([
            ['Activando Modo Juego...', 'acc'],
            ['  CPU governor -> performance', ''],
            ['  Procesos en segundo plano -> suspendidos', ''],
            ['  Efectos visuales -> reducidos', ''],
            ['<span class="ok">Modo Juego activo.</span> \u00a1A jugar!', '']
          ]);
          notify('Gaming Hub', 'Modo Juego activado: m\u00e1ximo rendimiento.');
        },
        clear: function () { out.innerHTML = ''; },
        startx: function () { print('Iniciando entorno gr\u00e1fico...', 'acc'); setTimeout(function () { location.href = 'exposicion/index.html'; }, 700); },
        exit: function () { print('Cerrando sesi\u00f3n...', 'acc'); setTimeout(function () { location.href = 'index.html'; }, 600); },
        sudo: function () { print('Ya sos root. Con gran poder viene gran responsabilidad.', 'acc'); }
      };

      function run(raw) {
        var text = raw.trim();
        prompt(raw);
        if (!text) return;
        history.push(text); hIdx = history.length;
        var name = text.split(/\s+/)[0].toLowerCase();
        if (COMMANDS[name]) COMMANDS[name]();
        else print('nsh: comando no encontrado: ' + esc(name) + ' <span class="muted">(escrib\u00ed "help")</span>', 'err');
      }

      cmd.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { run(cmd.value); cmd.value = ''; }
        else if (e.key === 'ArrowUp') { if (hIdx > 0) { hIdx--; cmd.value = history[hIdx]; } e.preventDefault(); }
        else if (e.key === 'ArrowDown') { if (hIdx < history.length - 1) { hIdx++; cmd.value = history[hIdx]; } else { hIdx = history.length; cmd.value = ''; } }
      });
      term.addEventListener('click', function () { cmd.focus(); });

      // ----- Arranque -----
      typeLines([
        ['Nebula OS 2.5 Ultimate <span class="muted">(kernel 6.8-nebula-custom)</span>', 'acc'],
        ['Nebula Shield: <span class="ok">ACTIVO</span> &middot; Nova AI: <span class="ok">EN L\u00cdNEA</span>', ''],
        ['Escrib\u00ed <span class="white">help</span> para ver los comandos. Prob\u00e1 <span class="white">neofetch</span>.', 'muted'],
        ['&nbsp;', '']
      ]);
      setTimeout(function () { notify('Bienvenido a Nebula OS', 'Est\u00e1s en el simulador en vivo. Arrastr\u00e1 la terminal y prob\u00e1 el dock.'); }, 900);
    })();
  </script>
