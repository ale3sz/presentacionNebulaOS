<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula OS - Live Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.94/build/spline-viewer.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        body { font-family: 'Inter', sans-serif; background: #000; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* CURSOR */
        .cursor-dot { width: 8px; height: 8px; background: #00ffcc; border-radius: 50%; position: fixed; pointer-events: none; z-index: 10000; box-shadow: 0 0 10px #00ffcc; transform: translate(-50%, -50%); }
        .cursor-outline { width: 40px; height: 40px; border: 1px solid rgba(0,255,204,0.5); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; }

        /* WALLPAPER */
        .wallpaper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: all; }

        /* TASKBAR */
        .taskbar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 80%; height: 65px; background: rgba(10, 14, 22, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(0,255,204,0.2); border-radius: 20px; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 20px; padding: 0 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; transition: 0.3s; position: relative; }
        .icon:hover { background: rgba(0,255,204,0.2); transform: translateY(-5px); color: #00ffcc; box-shadow: 0 5px 15px rgba(0,255,204,0.3); }
        .icon.active::after { content: ''; position: absolute; bottom: -5px; width: 6px; height: 6px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 10px #00ffcc; }

        /* WINDOW (TERMINAL) */
        .window { position: absolute; top: 20%; left: 30%; width: 600px; height: 400px; background: rgba(5, 7, 14, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,204,0.3); border-radius: 12px; z-index: 50; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.8); resize: both; }
        .window-header { height: 40px; background: rgba(0, 0, 0, 0.5); border-bottom: 1px solid rgba(0,255,204,0.1); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; }
        .window-title { color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 14px; }
        .window-controls { display: flex; gap: 8px; }
        .control { width: 12px; height: 12px; border-radius: 50%; }
        .close { background: #ff5f56; } .min { background: #ffbd2e; } .max { background: #27c93f; }
        .window-body { flex: 1; padding: 15px; color: #00ffcc; font-family: monospace; font-size: 14px; overflow-y: auto; }
        .cmd-line { display: flex; margin-bottom: 5px; }
        .cmd-prompt { color: #9d4edd; margin-right: 10px; }
        .cmd-input { background: transparent; border: none; color: #fff; font-family: monospace; font-size: 14px; width: 100%; outline: none; }
        
        /* EXIT BTN */
        .exit-preview { position: fixed; top: 20px; left: 20px; background: rgba(10, 14, 22, 0.6); color: #fff; padding: 10px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); z-index: 1000; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .exit-preview:hover { background: #ff5f56; border-color: #ff5f56; box-shadow: 0 0 15px rgba(255,95,86,0.5); }
    </style>
</head>
<body>
    <a href="index.html" class="exit-preview"><i class="fa-solid fa-arrow-left"></i> Salir del Simulador</a>

    <div class="wallpaper">
        <spline-viewer url="assets/scene.splinecode"></spline-viewer>
    </div>

    <div class="window" id="terminal">
        <div class="window-header" id="terminal-header">
            <div class="window-title"><i class="fa-solid fa-terminal"></i> root@nebula-os:~</div>
            <div class="window-controls">
                <div class="control min"></div>
                <div class="control max"></div>
                <div class="control close" onclick="document.getElementById('terminal').style.display='none'"></div>
            </div>
        </div>
        <div class="window-body" id="term-body">
            <div>Nebula OS v2.5 [Kernel 6.8-custom]</div>
            <div>Nebula Shield: ACTIVO (Modo Estricto)</div>
            <br>
            <div id="history"></div>
            <div class="cmd-line">
                <span class="cmd-prompt">root@nebula:~$</span>
                <input type="text" class="cmd-input" id="cmd" autocomplete="off" autofocus>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="icon" title="Menu"><i class="fa-brands fa-linux"></i></div>
        <div class="icon active" title="Terminal" onclick="document.getElementById('terminal').style.display='flex'"><i class="fa-solid fa-terminal"></i></div>
        <div class="icon" title="Navegador"><i class="fa-solid fa-globe"></i></div>
        <div class="icon" title="Archivos"><i class="fa-regular fa-folder-open"></i></div>
        <div class="icon" title="Nebula Store"><i class="fa-solid fa-store"></i></div>
        <div class="icon" title="Nova AI"><img src="assets/novaLogo.png" style="width:24px; filter: drop-shadow(0 0 5px #00ffcc);"></div>
    </div>

    <!-- CUSTOM CURSOR -->
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <script>
        // CURSOR LOGIC
        const cursorDot = document.getElementById('cursor-dot');
        const cursorOutline = document.getElementById('cursor-outline');
        window.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
            cursorOutline.animate({ left: e.clientX + 'px', top: e.clientY + 'px' }, { duration: 500, fill: 'forwards' });
        });

        // DRAGGABLE WINDOW
        const win = document.getElementById('terminal');
        const header = document.getElementById('terminal-header');
        let isDragging = false, startX, startY, initialX, initialY;
        
        header.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX; startY = e.clientY;
            initialX = win.offsetLeft; initialY = win.offsetTop;
        });
        window.addEventListener('mousemove', (e) => {
            if(!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            win.style.left = initialX + dx + 'px';
            win.style.top = initialY + dy + 'px';
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // TERMINAL LOGIC
        const cmdInput = document.getElementById('cmd');
        const historyDiv = document.getElementById('history');
        
        cmdInput.addEventListener('keypress', function(e) {
            if(e.key === 'Enter' && this.value) {
                const val = this.value;
                historyDiv.innerHTML += <div><span style="color:#9d4edd">root@nebula:~$</span> </div>;
                
                setTimeout(() => {
                    if(val === 'ls') {
                        historyDiv.innerHTML += <div style="color:#fff">Documentos/  Descargas/  Juegos/  Codigo_Fuente/  NebulaShield.log</div>;
                    } else if(val === 'whoami') {
                        historyDiv.innerHTML += <div style="color:#fff">root (System Administrator)</div>;
                    } else if(val === 'startx') {
                        window.location.href = 'exposicion/index.html';
                    } else {
                        historyDiv.innerHTML += <div style="color:#ff5f56">bash: : command not found</div>;
                    }
                    this.value = '';
                    document.getElementById('term-body').scrollTop = document.getElementById('term-body').scrollHeight;
                }, 200);
            }
        });
    </script>
</body>
</html>
